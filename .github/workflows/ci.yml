name: CI

on:
  push:
    branches: [master]
  pull_request:

# A new push to the same branch cancels the run still in flight: the only result
# that matters is the one for the latest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back/avento
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Formatting is checked before the tests on purpose: spotless fails in
      # seconds, and there is no point spending minutes on a suite that will be
      # rejected on style anyway.
      - name: Check formatting
        run: mvn -B -ntp spotless:check

      # No service containers here. The suite runs without PostgreSQL, Redis or
      # Ollama — every one of them is mocked or optional in the tests. Adding
      # them would only make the run slower and flakier.
      - name: Test
        run: mvn -B -ntp verify

  frontend:
    name: Frontend (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install
        run: npm ci

      # typecheck && lint && test && build, in that order — the project's own
      # definition of "ready", so CI and the local command cannot drift apart.
      - name: Validate
        run: npm run validate
