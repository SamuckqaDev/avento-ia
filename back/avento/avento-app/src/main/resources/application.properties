# Avento Application Configuration
spring.application.name=Avento Application

# Server configuration
server.port=${SERVER_PORT:8080}

# Database configuration (H2 for development, PostgreSQL for production)
spring.datasource.url=jdbc:h2:mem:avento;DB_CLOSE_DELAY=-1;MODE=POST
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (development only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Redis Configuration for Execution Engine
redis.host=localhost
redis.port=6379
redis.database=0
redis.timeout=5000ms

# JWT Configuration
jwt.secret=${JWT_SECRET:avento-secret-key-change-in-production}
jwt.expiration=86400000

# Application Features (enable/disable)
feature.execution-engine=true
feature.mcp-server=false
feature.media-generation=false
feature.voice-processing=false
feature.rag-search=false
